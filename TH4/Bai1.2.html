<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bài 1.2 - Tìm kiếm và lọc</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    input, select, button {
      padding: 10px;
      margin: 5px;
      font-size: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #f2f2f2;
    }

    .low-score {
      background: yellow;
    }

    .delete-btn {
      background: red;
      color: white;
      border: none;
      padding: 6px 10px;
      cursor: pointer;
    }

    .sortable {
      cursor: pointer;
      user-select: none;
    }

    .no-result {
      text-align: center;
      color: red;
      font-weight: bold;
      margin-top: 15px;
    }

    .stats {
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Bộ Lọc & Tìm Kiếm Danh Sách</h1>

  <div>
    <input type="text" id="fullname" placeholder="Họ tên">
    <input type="number" id="score" placeholder="Điểm (0-10)" step="0.1">
    <button id="addBtn">Thêm</button>
  </div>

  <div>
    <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên...">
    <select id="filterRank">
      <option value="Tất cả">Tất cả</option>
      <option value="Giỏi">Giỏi</option>
      <option value="Khá">Khá</option>
      <option value="Trung bình">Trung bình</option>
      <option value="Yếu">Yếu</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>STT</th>
        <th>Họ tên</th>
        <th id="scoreHeader" class="sortable">Điểm</th>
        <th>Xếp loại</th>
        <th>Thao tác</th>
      </tr>
    </thead>
    <tbody id="studentTableBody"></tbody>
  </table>

  <div id="noResult" class="no-result" style="display:none;">Không có kết quả</div>
  <div class="stats" id="stats">Tổng số sinh viên: 0 | Điểm trung bình: 0</div>

  <script src="Bai1.2.js"></script>
</body>
</html>

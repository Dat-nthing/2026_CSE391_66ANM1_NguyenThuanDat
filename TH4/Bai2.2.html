<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bài 2.2 - Form Đặt Hàng</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 750px;
      margin: 30px auto;
      padding: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .error {
      color: red;
      font-size: 14px;
      display: block;
      margin-top: 4px;
    }

    .invalid {
      border: 2px solid red;
    }

    .valid {
      border: 2px solid green;
    }

    .counter {
      text-align: right;
      font-size: 14px;
      color: #555;
      margin-top: 4px;
    }

    .counter.over {
      color: red;
      font-weight: bold;
    }

    .summary-box {
      display: none;
      margin-top: 20px;
      border: 1px solid #999;
      padding: 15px;
      background: #f9f9f9;
    }

    .success-box {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #e6ffe6;
      color: green;
      border: 1px solid green;
      font-weight: bold;
    }

    button {
      padding: 10px 16px;
      cursor: pointer;
      margin-right: 8px;
    }

    .total {
      font-size: 18px;
      font-weight: bold;
      color: blue;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Form Đặt Hàng</h1>

  <form id="orderForm">
    <div class="form-group">
      <label for="product">Tên sản phẩm</label>
      <select id="product">
        <option value="">-- Chọn sản phẩm --</option>
        <option value="Áo">Áo</option>
        <option value="Quần">Quần</option>
        <option value="Giày">Giày</option>
      </select>
      <span class="error" id="productError"></span>
    </div>

    <div class="form-group">
      <label for="quantity">Số lượng</label>
      <input type="number" id="quantity" min="1" max="99">
      <span class="error" id="quantityError"></span>
    </div>

    <div class="total" id="totalPrice">Tổng tiền: 0 VNĐ</div>

    <div class="form-group">
      <label for="deliveryDate">Ngày giao hàng</label>
      <input type="date" id="deliveryDate">
      <span class="error" id="deliveryDateError"></span>
    </div>

    <div class="form-group">
      <label for="address">Địa chỉ giao</label>
      <input type="text" id="address">
      <span class="error" id="addressError"></span>
    </div>

    <div class="form-group">
      <label for="note">Ghi chú</label>
      <textarea id="note" maxlength="300"></textarea>
      <div class="counter" id="noteCounter">0/200</div>
      <span class="error" id="noteError"></span>
    </div>

    <div class="form-group">
      <label>Phương thức thanh toán</label>
      <input type="radio" name="payment" value="COD"> COD
      <input type="radio" name="payment" value="Chuyển khoản"> Chuyển khoản
      <input type="radio" name="payment" value="Ví điện tử"> Ví điện tử
      <span class="error" id="paymentError"></span>
    </div>

    <button type="submit">Đặt hàng</button>
  </form>

  <div class="summary-box" id="summaryBox">
    <h3>Tóm tắt đơn hàng</h3>
    <div id="summaryContent"></div>
    <p><strong>Xác nhận đặt hàng?</strong></p>
    <button id="confirmBtn">Xác nhận</button>
    <button id="cancelBtn">Hủy</button>
  </div>

  <div class="success-box" id="successBox">
    Đặt hàng thành công! 🎉
  </div>

  <script src="Bai2.2.js"></script>
</body>
</html>
